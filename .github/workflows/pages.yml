name: pages
# The documentation site is written from the catalog, so it is rebuilt whenever the catalog or the site code changes.
on:
  push:
    branches: [main]
    paths:
      - 'src/Clarion.Core/Catalog/**'
      - 'src/Clarion.Core/Reports/**'
      - 'src/Clarion.Core/Model/TweakTooltip.cs'
      - 'src/Clarion.App/Theme.xaml'
      - 'tools/Clarion.Site/**'
      - 'docs/brand/**'
      - 'Directory.Build.props'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test tests/Clarion.Tests --filter "FullyQualifiedName~CatalogSiteTests"
      - run: dotnet run --project tools/Clarion.Site -- _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
