name: pages
# The documentation site is written from the catalog, so it is rebuilt whenever the catalog or the site code changes.
on:
  push:
    branches: [main]
    paths:
      - 'src/Clarion.Core/Catalog/**'
      - 'src/Clarion.Core/Reports/**'
      - 'src/Clarion.Core/Model/TweakTooltip.cs'
      - 'src/Clarion.App/Theme.xaml'
      - 'tools/Clarion.Site/**'
      - 'docs/brand/**'
      - 'Directory.Build.props'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test tests/Clarion.Tests --filter "FullyQualifiedName~CatalogSiteTests"
      - run: dotnet run --project tools/Clarion.Site -- _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
