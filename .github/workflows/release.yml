# Builds the setup program and portable zip, and on a version tag drafts the GitHub release with them. Signing steps run only when the repository
# variable SIGNPATH_ORGANIZATION_ID is set, so this works unsigned until signing is set up.
# See docs/SIGNING.md.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-latest
    # Writing is needed only to draft the release at the end, and the last two let the build vouch for its own files. The build steps never use them.
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
      # The command line tests start the real program, so it is built before they run, as in ci.yml.
      - run: dotnet build src/Clarion.App -p:Platform=x64
      - run: dotnet test tests/Clarion.Tests

      - name: Publish app
        run: dotnet publish src/Clarion.App -c Release -p:Platform=x64 -r win-x64 --self-contained -o artifacts/publish

      # The files that go into the setup program and the zip, not the ones the tests started, must answer on the command line.
      - name: Smoke test the published program
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          ./scripts/smoke-published.ps1 -PublishDir artifacts/publish -Version $version

      - name: Upload app files for signing
        id: unsigned-app
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-app
          path: artifacts/publish

      - name: Sign app files
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app

      - name: Build setup program and zip
        shell: pwsh
        run: |
          if ($env:SIGNING -eq 'true') { ./scripts/build-installer.ps1 -PublishDir signed-app }
          else { ./scripts/build-installer.ps1 -PublishDir artifacts/publish }

      - name: Upload setup program for signing
        id: unsigned-setup
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-setup
          path: artifacts/Clarion-*-setup.exe

      - name: Sign setup program
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Replace the setup program with the signed one and refresh its checksum
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed-setup -Filter 'Clarion-*-setup.exe' -Recurse | Select-Object -First 1
          if (-not $signed) { throw 'No signed setup program came back.' }
          Copy-Item $signed.FullName (Join-Path artifacts $signed.Name) -Force
          $hash = (Get-FileHash $signed.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content (Join-Path artifacts "$($signed.Name).sha256") "$hash  $($signed.Name)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            artifacts/Clarion-*-setup.exe
            artifacts/Clarion-*-win-x64.zip
            artifacts/*.sha256

      # A signed statement from GitHub that these exact files were built by this workflow from this commit. It is free, and anyone can check
      # it with `gh attestation verify`. It is not a Windows signature, so SmartScreen does not use it. It runs on a manual run too, so it can be tried
      # without tagging a release.
      - name: Vouch for the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/Clarion-*-setup.exe
            artifacts/Clarion-*-win-x64.zip

      # A tag draws up the release as a draft, with the changelog section as its notes. It stays a draft until a person reads it and
      # publishes it. A version with a dash, such as 0.1.0-beta.13, is marked as a pre-release.
      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment so a tag name is never pasted into the script text.
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME
          $version = $tag.Substring(1)
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($version))\s*\r?\n(.*?)(?=^## |\z)")
          if (-not $section.Success) { throw "CHANGELOG.md has no section for $version." }
          Set-Content release-notes.md $section.Groups[1].Value.Trim()
          $title = '.Clarion ' + ($version -replace '-alpha\.', ' Alpha ' -replace '-beta\.', ' Beta ' -replace '-rc\.', ' RC ')
          $files = @(Get-ChildItem artifacts -File | Where-Object { $_.Name -match '^Clarion-.*(setup\.exe|win-x64\.zip|\.sha256)$' } | ForEach-Object FullName)
          if ($files.Count -ne 4) { throw "Expected 4 release files and found $($files.Count)." }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag @files --clobber }
          else
          {
            $flags = @('--draft')
            if ($version.Contains('-')) { $flags += '--prerelease' }
            gh release create $tag @files --verify-tag --title $title --notes-file release-notes.md @flags
          }
          if ($LASTEXITCODE -ne 0) { throw 'Drafting the release failed.' }
