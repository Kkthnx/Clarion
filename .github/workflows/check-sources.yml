# Checks the source links in the catalog once a month, so dead pages are found while they are cheap to fix and not the night before
# a release. A run fails only when a link is dead (404 or 410). Flaky answers are listed in the summary and do not fail it.
# The winget package IDs of the app catalog are checked in the same run, and on any pull request that changes the app list.
name: check-sources
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Clarion.Core/Catalog/Data/apps.json'
      - 'scripts/check-winget-ids.ps1'
permissions:
  contents: read
jobs:
  links:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the source links
        shell: powershell
        run: ./scripts/check-sources.ps1 -ReportPath source-report.md

      - name: Put the report in the run summary
        if: always()
        shell: powershell
        run: |
          if (Test-Path source-report.md) { Get-Content source-report.md | Add-Content $env:GITHUB_STEP_SUMMARY }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-report
          path: source-report.md
          if-no-files-found: ignore

  winget-ids:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Winget's community source is the microsoft/winget-pkgs repository, so each exact ID is looked up there. winget is not needed.
      - name: Check the winget package IDs
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/check-winget-ids.ps1 -ReportPath id-report.md

      - name: Put the report in the run summary
        if: always()
        shell: powershell
        run: |
          if (Test-Path id-report.md) { Get-Content id-report.md | Add-Content $env:GITHUB_STEP_SUMMARY }
