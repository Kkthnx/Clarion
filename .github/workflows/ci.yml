name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build src/Clarion.App -p:Platform=x64
      # Whitespace only, so a formatting slip fails here and a style opinion does not.
      - run: dotnet format whitespace Clarion.sln --verify-no-changes --no-restore
      - run: dotnet test tests/Clarion.Tests

  # The workflows run with permission to write releases and sign files, so a mistake in one is worth catching before it runs.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
